name: Terraform Import IAM Users
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state-dev
  cancel-in-progress: false

jobs:
  import:
    name: Import Existing IAM Users
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -reconfigure -input=false

      - name: Verify Terraform Backend and Workspace
        shell: bash
        run: |
          echo "===== CURRENT WORKSPACE ====="
          terraform workspace show

          echo "===== S3 BACKEND CONFIGURATION ====="
          grep -A 10 'backend "s3"' *.tf || true

          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

          echo "===== TERRAFORM STATE ====="
          terraform state list

      - name: Show Current State
        run: terraform state list

      - name: Confirm Terraform State Accessible
        shell: bash
        run: |
          set -euo pipefail
          terraform state pull > /dev/null
          echo "Terraform remote state is accessible."

      - name: Import Julia
        shell: bash
        run: |
          ADDRESS='module.iam_users.aws_iam_user.new_users["iamuser-julia"]'

          if terraform state list | grep -Fxq "$ADDRESS"; then
            echo "Julia already tracked; skipping."
          else
            terraform import -input=false "$ADDRESS" iamuser-julia
          fi

      - name: Import Pablo
        shell: bash
        run: |
          ADDRESS='module.iam_users.aws_iam_user.new_users["iamuser-pablo"]'

          if terraform state list | grep -Fxq "$ADDRESS"; then
            echo "Pablo already tracked; skipping."
          else
            terraform import -input=false "$ADDRESS" iamuser-pablo
          fi

      - name: Import Existing S3 Lab Bucket
        shell: bash
        run: |
          ADDRESS='aws_s3_bucket.terraform_state'

          if terraform state list | grep -Fxq "$ADDRESS"; then
            echo "S3 bucket already tracked; skipping."
          else
            terraform import -input=false "$ADDRESS" terraform-state-2527a9a1
          fi

      - name: Verify Imported State
        run: terraform state list

      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Plan
        run: terraform plan -input=false -no-color
